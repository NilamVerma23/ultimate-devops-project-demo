# CI for product catalog service

name: product-catalog-ci

on:
  pull_request:
    branches:
      - main

jobs:   
    build:
        runs-on: ubuntu-latest

        steps:
        - name: Checkout code
          uses: actions/checkout@v4

        - name: Setup Go 1.22
          uses: actions/setup-go@v5
          with:
            go-version: 1.22

        - name: Build
          run: |
            cd src/product-catalog
            go mod download
            go build -v product-catalog-service src/product-catalog/main.go

        - name: Unit tests
          run: |
            cd src/product-catalog
            go test ./...
 
    code-quality:
        runs-on: ubuntu-latest

        steps:
        - name: Checkout code
          uses: actions/checkout@v4

        - name: Run golangci-lint
          run: 
                go install github.com/golangci/golangci-lint/cmd/golangci-lint@latest
                golangci-lint run ./src/product-catalog/...

    docker:
        runs-on: ubuntu-latest

        needs: build

        steps:
        - name: Checkout code
          uses: actions/checkout@v4

        - name: Install docker
          uses: docker/setup-buildx-action@v3

        - name: Login to dockerhub
          uses: docker/login-action@v3
          with:
            username: ${{ secrets.DOCKER_USERNAME }}
            password: ${{ secrets.DOCKER_TOKEN }}

        - name: Docker push
          uses: docker/build-push-action@v6
          with:
            context: src/product-catalog
            file: Dockerfile
            push: true
            tags: ${{ secrets.DOCKER_USERNAME }}/product-catalog:${{ github.run_id }}
    update-k8s:
        runs-on: ubuntu-latest

        needs: docker

        steps:
        - name: checkout code
          uses: actions/checkout@v4
          with:   
            token: ${{ secrets.GITHUB_TOKEN }}
        
        - name: Update tag in k8s deployment menifest
          run: |
               sed -i "s|image: .*|image: ${{ secrets.DOCKER_USERNAME }}/product-catalog:${{github.run_id}}|" kubernetes/productcatalog/deploy.yaml
               
        - name: Commit and push changes
          run: |
               git config --global user.name "NilamVerma23"
               git config --global user.email "nilam55686@gmail.com"
               git add kubernetes/productcatalog/deploy.yaml
               git commit -m "[CI]: Update product catalog image tag"
               git push origin HEAD:main -f
